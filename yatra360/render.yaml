# Yatra360 — one backend, one frontend.
#
# The business console is NOT a separate service any more: it is mounted
# inside the same React app at /business/*. If you previously deployed
# `yatra360-buisness` as its own static site, that service can be deleted.
services:
  - type: web
    name: yatra360-backend
    runtime: python
    rootDir: yatra360-backend
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: yatra360-db
          property: connectionString
      - key: CORS_ORIGINS
        value: https://yatra360-frontend.onrender.com
      # Signs business-console session tokens. Render generates a value.
      - key: BUSINESS_TOKEN_SECRET
        generateValue: true

  - type: web
    name: yatra360-frontend
    runtime: static
    rootDir: yatra360-frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    # Client-side routes like /business/app/crowd must fall through to
    # index.html, otherwise a refresh on a deep link 404s.
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        value: https://yatra360-backend.onrender.com

databases:
  - name: yatra360-db
    plan: free
