services:
  - type: web
    name: yatra360-backend
    runtime: python
    rootDir: yatra360-backend
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: yatra360-db
          property: connectionString
      - key: CORS_ORIGINS
        value: https://yatra360-frontend.onrender.com

  - type: web
    name: yatra360-frontend
    runtime: static
    rootDir: yatra360-frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL
        value: https://yatra360-backend.onrender.com

databases:
  - name: yatra360-db
    plan: free
